# ==============================================================================
# SECUREAUTH ENTERPRISE SPRING BOOT 3.x CONFIGURATION
# ==============================================================================
server.port=8080

# ==============================================================================
# 1. PRIMARY ACTIVE DATASOURCE: MySQL 8.0 Database (auth_db)
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Enterprise High-Performance Connection Pool Settings
spring.datasource.hikari.pool-name=SecureAuthMySQLHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate & JPA Properties for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

